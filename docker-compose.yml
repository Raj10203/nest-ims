services:
  app:
    image: node:24-alpine
    container_name: nest_ims_app
    working_dir: /app
    command: sh -c "npm install --include=dev && npm run start:dev"
    ports:
      - '3001:3000'
    volumes:
      - ./:/app
    environment:
      NODE_ENV: ${NODE_ENV:-development} # read from .env, so it is the only switch
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nest_ims
      DB_USER: user
      DB_PASSWORD: password
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ims}:${RABBITMQ_PASSWORD:-ims}@rabbitmq:5672
      # Only for GET /health (the worker sends the mail)
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Azurite's published development account (not a secret)
      AZURE_STORAGE_CONNECTION_STRING: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;'
      AZURE_STORAGE_CONTAINER: avatars
      # Blob URLs stored in the DB must open in the host's browser, not only inside Docker
      AZURE_STORAGE_PUBLIC_URL: http://localhost:10000/devstoreaccount1
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      azurite:
        condition: service_started

  mysql:
    image: mysql:8.0.44
    container_name: nest_ims_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nest_ims
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - '3308:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-prootpassword',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: node:24-alpine
    container_name: nest_ims_worker
    working_dir: /app
    command: sh -c "npm install --include=dev && npm run start:worker:dev"
    volumes:
      - ./:/app
    environment:
      NODE_ENV: ${NODE_ENV:-development} # read from .env, so it is the only switch
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ims}:${RABBITMQ_PASSWORD:-ims}@rabbitmq:5672
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: IMS <no-reply@ims.local>
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_started
      mailpit:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nest_ims_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ims}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ims}
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI (RABBITMQ_USER / RABBITMQ_PASSWORD, default ims / ims)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: nest_ims_mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    healthcheck:
      disable: true

  # Azure Blob Storage emulator; production uses a real storage account
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: nest_ims_azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - '10000:10000' # Blob service
    volumes:
      - azurite_data:/data

volumes:
  azurite_data:
  mysql_data:
  rabbitmq_data:
