services:
  app:
    image: node:24-alpine
    container_name: nest_ims_app
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3001:3000"
    volumes:
      - ./:/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nest_ims
      DB_USER: user
      DB_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0.44
    container_name: nest_ims_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nest_ims
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
