trigger: none

pool:
  name: nest-ims-pool

parameters:
  - name: imageTag
    displayName: Git commit SHA to deploy
    type: string
    default: '48a213b6fbc237b3f6e83a239c8c36c38817e389'

steps:
  - checkout: none

  - task: SSH@0
    displayName: Deploy image to Azure VM
    inputs:
      sshEndpoint: 'nest-ims-vm-service-connection'
      runOptions: 'commands'
      commands: |
        set -e
        echo "Deploying image: raj10203/nest-ims:${{ parameters.imageTag }}"
        sudo /opt/nest-ims/deploy.sh "raj10203/nest-ims:${{ parameters.imageTag }}"
      readyTimeout: '20000'
