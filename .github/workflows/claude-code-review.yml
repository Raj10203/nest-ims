name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs, CI files and lockfile-only pushes do not trigger a review.
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.claude/**'
      - 'azure-pipelines.yml'
      - 'package-lock.json'

# A new push to the same PR cancels the review still running for the old commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Both jobs fail as a warning (a red check), never as a merge block: they are not
# required checks. "Claude review" fails unless the verdict is ✅.
jobs:
  # Rewrites the bot's block of the PR description for the head commit, so the
  # review below checks the code against an up-to-date description.
  describe:
    name: PR description
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            You write the release-facing part of this pull request's description, for a
            product owner and for whoever releases it. Reviewers read the code; you do
            NOT explain how the code works.

            ## Gather
            1. Read CLAUDE.md (deploy order, seed command, env files, services).
            2. List the changed files: `gh pr diff ${{ github.event.pull_request.number }} --name-only`,
               then read what you need with
               `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- <path>`.
               Skip `package-lock.json` and `src/generated/`.
            3. The current body, for context only: `gh pr view ${{ github.event.pull_request.number }} --json body --jq .body`.

            ## Rules for what to declare (check every one against the diff)
            - Schema: read every migration added or changed in `src/database/migrations/`
              (the `up` SQL is the truth) and the entity changes in `src/entities/`. Group
              by table: one bold line per table, then one bullet per changed column,
              index, foreign key or constraint. For a new table, the bold line says
              "new table" and its purpose, and it lists every column except `id`,
              `createdAt` and `updatedAt`; for a dropped table, the bold line alone.
              Each bullet is `name`: change: purpose.
              - The change for a new column is `new, <definition>`; for a dropped one
                `dropped (was <definition>)`; for a modified one
                `<before>` → `<after>`. A definition is the type and
                nullability/default in short form (`varchar(1024), null`,
                `int, not null, FK → users`). Read a modified column's "before" on the
                base branch with
                `git show origin/${{ github.event.pull_request.base.ref }}:<entity file>` or in the
                earlier migration that created it.
              - The purpose says in plain words what it stores, or why it changed.
              - Safe while the old version still runs: additive, nullable or defaulted,
                and widened (longer varchar, bigger int) changes. Renamed, dropped or
                narrowed columns and new NOT NULL columns without a default are not:
                end that bullet with "**Not safe with the old version.**" (and add its
                step to the release notes). Say nothing for safe changes.

            ## Release notes: only what THIS PR needs beyond the standard deploy
            Every deploy already builds the app, installs dependencies, runs pending
            migrations, starts the new API and worker and checks that they are healthy.
            Never list those, or generic checks such as "check /health" or "try the new
            feature". List a step only when this PR causes it:
            - Seeder: a change in `src/database/seeds/` (roles, permissions): run
              `node dist/cli/cli.js seed` after the migrations.
            - Configuration: a variable added or changed in `.env.example` or `src/config/`:
              name it, the value to set and on which server (API, worker); say when it is
              optional.
            - Third parties: a new external service, account, key, container, bucket,
              queue, webhook or provider (`docker-compose.yml`, `package.json`,
              `src/config/`): what must be created or activated, and where its credentials go.
            - A migration that is NOT safe while the old version runs: the special order or
              maintenance window it needs.
            - One-off manual steps the code relies on: a data fix, a backfill, a file or
              account to create by hand.
            - Coordination: a changed route, request or response that needs the frontend
              or another client released at the same time.
            - Business changes: features added, changed or removed and rules that changed
              (who may do what, limits, what users now see or are blocked from), in plain
              words. Group small related changes into one bullet.
            Never invent a step. If unsure, check the files above; leave it out if the diff
            does not show it.

            ## Format
            No file, class, function or library names except where a release step needs
            one (a variable, a command). No code. Short bullets. Write "None." for an empty
            section; never drop a section. Exactly this block:

            <!-- auto-description:start -->
            <!-- Generated for commit <first 7 characters of HEAD COMMIT> by the "PR description" job. Write your own notes outside this block: it is replaced on every push. -->

            ## Summary

            One or two sentences: what this PR delivers and why.

            ## Business changes

            - **New:** / **Changed:** / **Removed:** what changed, for whom.

            ## Schema changes

            **users**

            - `avatarUrl`: new, `varchar(1024), null`: link to the user's profile picture.
            - `nickname`: dropped (was `varchar(50), null`): never shown anywhere. **Not safe with the old version.**

            **sites**

            - `address`: `varchar(255), null` → `varchar(1024), null`: longer street addresses did not fit.

            **notifications** (new table): a user's inbox of in-app notifications.

            - `userId`: new, `int, not null, FK → users (cascade)`: who receives it.
            - `readAt`: new, `datetime, null`: when it was read; null while unread.
            - index (`userId`, `readAt`): counts a user's unread notifications quickly.

            (These lines only show the format. Write "None." instead when no migration
            changed.)

            ## Release notes

            - [ ] **Before deploy** / **After deploy**: one PR-specific step per line, with
                  the exact variable name or command.

            <!-- auto-description:end -->

            In "Release notes", write "Nothing beyond the standard deploy." when this PR
            needs no extra step.

            ## Output
            Write only the block above, from the start marker to the end marker, to
            /tmp/pr-block.md (never inside the repo). The next step puts it into the
            description and keeps the author's text. Do not edit the PR and do not comment.
            Never change the working tree, index, HEAD or branches. A denied command is
            never a reason to stop: use an allowed tool and always write the file.
          # Write is only for /tmp/pr-block.md; the PR itself is edited by the next step.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"

      - name: Show denied tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' \
            "$EXECUTION_FILE" || true

      # Swaps the bot's block in the description, keeping the author's text; the
      # first time, the old body moves below the block under "Author notes".
      - name: Update the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short="${SHA:0:7}"
          if ! grep -q "Generated for commit $short" /tmp/pr-block.md 2>/dev/null \
            || ! grep -q '<!-- auto-description:end -->' /tmp/pr-block.md; then
            echo "::error::Claude did not write a description block for $short. See 'Show denied tool calls'."
            exit 1
          fi
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/pr-old.md
          python3 - <<'PY'
          import re
          block = open('/tmp/pr-block.md').read().strip()
          block = block[block.index('<!-- auto-description:start -->'):]
          block = block[:block.index('<!-- auto-description:end -->') + len('<!-- auto-description:end -->')]
          old = open('/tmp/pr-old.md').read().strip()
          pattern = re.compile(r'<!-- auto-description:start -->.*?<!-- auto-description:end -->', re.S)
          if pattern.search(old):
              body = pattern.sub(lambda _: block, old, count=1)
          elif old:
              body = f'{block}\n\n## Author notes\n\n{old}'
          else:
              body = block
          open('/tmp/pr-body.md', 'w').write(body + '\n')
          PY
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md
          echo "Description updated for $short"

  review:
    name: Claude review
    # After the description, even if writing it failed.
    needs: describe
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            You are a senior reviewer for this NestJS 12 / TypeORM / MySQL API.

            ## Context (read first)
            1. CLAUDE.md: the project rules (ESM `.js` imports, zod DTOs, two-layer CASL
               authorization with 404 for out-of-scope records, a migration for every
               schema change, backward-compatible migrations, at-least-once job handlers,
               secret masking in logs, comment style).
            2. The PR description: `gh pr view ${{ github.event.pull_request.number }} --json title,body`.
               The block between `<!-- auto-description:start -->` and `end` was written
               from this diff by a bot just before you; text outside it is the author's.

            ## Review
            Review the WHOLE pull request every time, not only the latest commit, and
            ignore earlier review comments.
            For a large PR, list the files first (`gh pr diff ${{ github.event.pull_request.number }} --name-only`),
            then read the diff file by file with
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- <path>`. Skip
            `package-lock.json` and `src/generated/` (generated).
            1. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Use
               `git diff`, `git log` and `git show` against `origin/${{ github.event.pull_request.base.ref }}`
               and read each changed file around the change before commenting on it.
            2. Intent: does the code match the description? Check its "Schema changes"
               and "Release notes" sections against the diff in both directions. A
               missing PR-specific release step (seed run, env variable, third-party
               setup, unsafe migration, manual data fix) is Important; routine deploy
               steps (build, migrations, restarts, health checks) must not be listed
               there. Other gaps in the description are Minor, never a reason to block
               the merge.
            3. Correctness and security: logic errors, edge cases, race conditions,
               unawaited promises, auth and permission checks, data leaking into logs or
               responses, migrations that would break the version still running.
            4. Impact on existing code: for every changed or removed export, service
               method, guard, decorator, helper, entity column or relation, DTO/schema
               and response shape, find ALL its usages with Grep (including files the PR
               does not touch, specs, the CLI and the worker), and read each caller.
               Check that every caller still works with the new signature, arguments,
               return value, thrown errors, loaded relations and side effects. Also
               check API clients: name every changed route, status code, request field
               or response field in "Merge notes" so clients can be updated (it is not
               a finding by itself). A caller this PR breaks is this PR's issue; name
               the caller's `path:line` in the finding.
            5. Tests: new behaviour without a test.
            Do not flag formatting or lint issues (Prettier and oxlint cover them), or
            problems in code the PR does not touch, unless this PR's change breaks it
            (one line at most otherwise, if serious).

            ## Calibration (most important)
            A clean PR is a normal, expected result. Do not search for something to say:
            "No issues found." with a ✅ verdict is the right answer for most good PRs.
            - Critical or Important only when you can state a concrete failure: these
              inputs or this sequence of events -> this wrong result, and you confirmed it
              by reading the code path end to end. If you cannot write that sentence, it
              is Minor or it is dropped.
            - Do not report: hypotheticals ("could", "might", "consider"), design
              preferences, alternative approaches, missing tests for code that already
              has tests or is trivial, or "add an integration test" suggestions.
            - Do not re-raise a trade-off the code already explains in a comment or the
              PR description already declares as intended. Disagreeing with a documented
              decision is not a finding.
            - Minor: at most 3 items, only ones a maintainer would actually act on.
            - Before posting, re-check every Critical and Important finding against the
              code once more. Drop it, or move it to Minor, if it does not hold up.

            ## Read-only
            Never change the working tree, index, HEAD or branches: no checkout, commit,
            stash or file edits in the repo.

            ## Always post
            Only the allowed tools work; anything else is denied. A denied command is
            never a reason to stop: use an allowed tool instead (Read, Grep, the git and
            gh commands above), and always finish by posting the comment.

            ## Output
            Write the comment in Markdown to /tmp/review.md (never inside the repo), then
            post it as ONE new comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md`.
            Never edit or delete earlier comments (the workflow hides older reviews itself). Use exactly this structure, with a blank
            line between every heading, paragraph and list:

            ## Claude review

            Reviewed commit `<first 7 characters of HEAD COMMIT>` · **Risk:** low | medium | high

            ### Issues

            **Critical (must fix)**: a verified bug, security hole, data loss or broken
            behaviour in normal use.

            **Important (should fix)**: a verified failure in a realistic edge case (error
            path, concurrency, a caller in this repo broken by the change, migration that
            breaks the running version), or risky new logic with no test at all.

            **Minor**: small improvements worth a mention. They never block the merge.

            Under each bucket, one bullet per finding: `path/file.ts:line`, what is wrong,
            why it matters, and the fix. Omit empty buckets. If there are none at all,
            write "No issues found." under the Issues heading.

            ### Merge notes

            2 to 4 bullets for the human reviewer: the riskiest parts to look at, and
            anything to do before or after merging (migrations to run, env vars to set,
            services to restart, clients to update). Write "Nothing extra." if there is none.

            ### Verdict

            Exactly one of these three lines (copy it as written), followed by 1 to 2
            sentences of reasoning. It is decided only by the buckets, never by gut feeling:
            - `✅ **Mergeable**` when there are no Critical and no Important items (Minor items are fine).
            - `⚠️ **Mergeable with fixes**` when there is at least one Important item and no Critical.
            - `❌ **Not mergeable**` when there is at least one Critical item.

            Risk follows the same rule: low for ✅, medium for ⚠️, high for ❌. This job
            fails on ⚠️ and ❌ (a warning on the PR), so never soften a verified
            Important or Critical finding to get a ✅, and never invent one.

            Rules: most severe first. No praise, no summary of what the PR does, no vague
            findings like "improve error handling". Always give a verdict.
          # Write is only for /tmp/review.md; the prompt forbids writing in the repo.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"

      # The full transcript stays off (public repo: it can contain secrets); the
      # denied commands alone explain a review that stopped early.
      - name: Show denied tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "\(.tool_name): \(.tool_input.command // .tool_input.file_path // "")"' \
            "$EXECUTION_FILE" || true

      # Only the latest review stays open: earlier ones are hidden as outdated (still
      # one click away). Nothing is hidden when no review was posted for this commit.
      - name: Hide earlier reviews
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short="${SHA:0:7}"
          gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR" -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  comments(last: 100) { nodes { id body isMinimized viewerDidAuthor } }
                }
              }
            }' > /tmp/comments.json
          # viewerDidAuthor: only this bot's reviews, never a person's comment.
          ids=$(jq -r --arg marker "Reviewed commit \`$short\`" '
            [.data.repository.pullRequest.comments.nodes[]
              | select(.viewerDidAuthor and (.body | startswith("## Claude review")))] as $reviews
            | ([$reviews[] | select(.body | contains($marker))] | last | .id) as $latest
            | if $latest == null then empty
              else $reviews[] | select(.isMinimized | not) | select(.id != $latest) | .id end
          ' /tmp/comments.json)
          if [ -z "$ids" ]; then
            echo "Nothing to hide."
            exit 0
          fi
          for id in $ids; do
            gh api graphql -f id="$id" -f query='
              mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                  minimizedComment { isMinimized }
                }
              }' > /dev/null
            echo "Hid $id as outdated"
          done

      # Fails (a warning on the PR, not a merge block) unless the review for this
      # commit says ✅. The action itself reports success even when Claude posted nothing.
      - name: Check the review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short="${SHA:0:7}"
          body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            | jq -r --arg marker "Reviewed commit \`$short\`" \
              '[.comments[] | select(.body | contains($marker))] | last | .body // ""')
          if [ -z "$body" ]; then
            echo "::error::Claude finished without posting a review for $short. See 'Show denied tool calls'."
            exit 1
          fi
          risk=$(printf '%s\n' "$body" | grep -oE '\*\*Risk:\*\* (low|medium|high)' | head -n1 | awk '{print $2}')
          case "$risk" in
            low)
              echo "✅ Mergeable (risk low) for $short" ;;
            medium)
              echo "::error::Claude review: ⚠️ Mergeable with fixes (risk medium) for $short. Fix the Important items and push to re-run."
              exit 1 ;;
            high)
              echo "::error::Claude review: ❌ Not mergeable (risk high) for $short. Fix the Critical items and push to re-run."
              exit 1 ;;
            *)
              echo "::error::Could not read the risk level from the review of $short."
              exit 1 ;;
          esac
